<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Surprise Nandiraa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #awal {
            text-align: center;
        }

        #tombol {
            padding: 15px 25px;
            border: none;
            border-radius: 30px;
            background: #ff4f91;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #tombol:active {
            transform: scale(0.95);
        }

        #isi {
            display: none;
            text-align: center;
        }

        .love {
            font-size: 90px;
            opacity: 0;
            transform: scale(0);
            margin: 10px;
        }

        .muncul {
            animation: muncul 0.7s ease forwards;
        }

        @keyframes muncul {
            0% {
                opacity: 0;
                transform: scale(0);
            }

            60% {
                opacity: 1;
                transform: scale(1.3);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        #surprise {
            display: none;
            color: white;
            font-size: 40px;
            font-weight: bold;
            margin-top: 20px;
            animation: zoom 1s ease;
        }

        #nama {
            display: none;
            color: #ff6fa5;
            font-size: 55px;
            font-weight: bold;
            margin-top: 15px;
            text-shadow: 0 0 20px #ff4f91;
            animation: zoom 1s ease;
        }

        @keyframes zoom {
            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div id="awal">
        <button id="tombol">💗 KLIK DI SINI 💗</button>
    </div>

    <div id="isi">

        <div id="love1" class="love">❤️</div>
        <div id="love2" class="love">💗</div>
        <div id="love3" class="love">💖</div>
        <div id="love4" class="love">💕</div>
        <div id="love5" class="love">💓</div>

        <div id="surprise">🎁 LOVEEEEE YOUUUU SAYANGGGG NANDIRAAAA BANYAA</div>

        <div id="nama">Nandiraa 💗</div>

    </div>

    <script>
        document.getElementById("tombol").onclick = function () {

            document.getElementById("awal").style.display = "none";
            document.getElementById("isi").style.display = "block";

            setTimeout(function () {
                document.getElementById("love1").classList.add("muncul");
            }, 300);

            setTimeout(function () {
                document.getElementById("love2").classList.add("muncul");
            }, 1000);

            setTimeout(function () {
                document.getElementById("love3").classList.add("muncul");
            }, 1700);

            setTimeout(function () {
                document.getElementById("love4").classList.add("muncul");
            }, 2400);

            setTimeout(function () {
                document.getElementById("love5").classList.add("muncul");
            }, 3100);

            setTimeout(function () {
                document.getElementById("surprise").style.display = "block";
            }, 4000);

            setTimeout(function () {
                document.getElementById("nama").style.display = "block";
            }, 5200);
        };
    </script>

</body>
</html>
